<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Taller de Brownie | Catálogo Digital</title>
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-light: #DDD6FE;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-muted: #6B7280;
      --accent: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background: #FFF; padding: 15px 20px; text-align: center; border-bottom: 1px solid #E5E7EB; position: sticky; top: 0; z-index: 10; }
    .brand { font-weight: bold; font-size: 1.4rem; color: var(--primary); }
    .subtext { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    
    .cat-bar { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; background: #FFF; border-bottom: 1px solid #E5E7EB; }
    .cat-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--primary-light); background: #FFF; color: var(--primary); font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #FFF; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; max-width: 800px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid #E5E7EB; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .card-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; flex-grow: 1; }
    .card-price { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .add-btn { background: var(--primary-light); color: var(--primary); border: none; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
    
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #FFF; border-top: 1px solid #E5E7EB; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
    .cart-btn { background: var(--accent); color: #FFF; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    
    /* Modal */
    .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 30; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #FFF; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 8px; border: 1px solid #CCC; border-radius: 6px; }
    .close-btn { background: #EF4444; color: #FFF; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; float: right; }
  </style>
</head>
<body>

<header>
  <div class="brand">El Taller de Brownie</div>
  <div class="subtext">Catálogo de papelería y productos educativos</div>
</header>

<div class="cat-bar">
  <button class="cat-btn active" onclick="filterCat('todos')">Todos</button>
  <button class="cat-btn" onclick="filterCat('agendas')">Agendas & Planeadores</button>
  <button class="cat-btn" onclick="filterCat('cuadernos')">Cuadernos & Libretas</button>
  <button class="cat-btn" onclick="filterCat('educativo')">Material Educativo</button>
  <button class="cat-btn" onclick="filterCat('stickers')">Stickers & Accesorios</button>
</div>

<div class="grid" id="product-grid"></div>

<div class="cart-bar">
  <div>
    <div style="font-size: 0.8rem; color: var(--text-muted);">Total estimado:</div>
    <div id="total-price" style="font-size: 1.1rem; font-weight: bold; color: var(--primary);">$0.00 MXN</div>
  </div>
  <button class="cart-btn" onclick="openModal()">Ver Pedido (<span id="cart-count">0</span>)</button>
</div>

<!-- Modal Checkout -->
<div class="modal" id="checkout-modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3 style="margin-bottom: 15px;">Resumen de tu Pedido</h3>
    <div id="cart-items" style="margin-bottom: 15px; font-size: 0.9rem;"></div>
    
    <div class="field">
      <label>Nombre completo:</label>
      <input type="text" id="cust-name" placeholder="Tu nombre">
    </div>
    
    <div class="field">
      <label>Método de entrega:</label>
      <select id="cust-delivery">
        <option value="Entrega local en Cancún">Entrega local en Cancún</option>
        <option value="Contra-entrega (Punto medio)">Contra-entrega (Punto a acordar)</option>
        <option value="Envío a domicilio">Envío a domicilio</option>
      </select>
    </div>

    <div class="field">
      <label>Forma de pago elegida:</label>
      <select id="cust-payment">
        <option value="Transferencia BBVA (Andrea Paola Romero)">Transferencia BBVA</option>
        <option value="Transferencia Nu">Transferencia Nu</option>
        <option value="Pago con tarjeta">Pago con tarjeta</option>
        <option value="Efectivo al entregar">Efectivo</option>
      </select>
    </div>

    <button onclick="sendWhatsApp()" style="width:100%; background:#10B981; color:#FFF; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-top:10px; cursor:pointer;">
      Enviar Pedido por WhatsApp 📲
    </button>
  </div>
</div>

<script>
  // Aaquí puedes agregar o editar todos los productos que quieras
  const products = [
    { id: 1, name: "Agenda Docente 2026", cat: "agendas", price: 250, desc: "Planeador para profesores, incluye control de asistencia y calificaciones." },
    { id: 2, name: "Cuaderno Profesional Pasta Dura", cat: "cuadernos", price: 120, desc: "100 hojas de papel grueso de alta calidad." },
    { id: 3, name: "Kit de Stickers Educativos", cat: "stickers", price: 45, desc: "Planilla con 50 stickers motivacionales." },
    { id: 4, name: "Flashcards del Abecedario", cat: "educativo", price: 95, desc: "Tarjetas plastificadas para aprendizaje preescolar." },
    { id: 5, name: "Planeador Semanal de Escritorio", cat: "agendas", price: 180, desc: "Bloc engomado de 50 hojas sin fecha." },
    { id: 6, name: "Libreta de Apuntes A5", cat: "cuadernos", price: 85, desc: "Tamaño medio oficio, ideal para llevar a todos lados." },
    { id: 7, name: "Set de Lectoescritura", cat: "educativo", price: 150, desc: "Material interactivo reutilizable para lectoescritura." },
    { id: 8, name: "Stickers Decorativos Papelería", cat: "stickers", price: 35, desc: "Set de pegatinas impermeables variadas." }
  ];

  let cart = {};

  function renderProducts(filter = 'todos') {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '';
    const filtered = filter === 'todos' ? products : products.filter(p => p.cat === filter);
    
    filtered.forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <div>
            <div class="card-title">${p.name}</div>
            <div class="card-desc">${p.desc}</div>
          </div>
          <div>
            <div class="card-price">$${p.price.toFixed(2)} MXN</div>
            <button class="add-btn" onclick="addToCart(${p.id})">+ Agregar</button>
          </div>
        </div>
      `;
    });
  }

  function filterCat(cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderProducts(cat);
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCart();
  }

  function updateCart() {
    let count = 0;
    let total = 0;
    for (let id in cart) {
      const p = products.find(prod => prod.id == id);
      count += cart[id];
      total += p.price * cart[id];
    }
    document.getElementById('cart-count').innerText = count;
    document.getElementById('total-price').innerText = `$${total.toFixed(2)} MXN`;
  }

  function openModal() {
    if (Object.keys(cart).length === 0) {
      alert("Agrega al menos un producto al carrito primero.");
      return;
    }
    const container = document.getElementById('cart-items');
    container.innerHTML = '';
    for (let id in cart) {
      const p = products.find(prod => prod.id == id);
      container.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
        <span>${p.name} x${cart[id]}</span>
        <b>$${(p.price * cart[id]).toFixed(2)}</b>
      </div>`;
    }
    document.getElementById('checkout-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('checkout-modal').style.display = 'none';
  }

  function sendWhatsApp() {
    const name = document.getElementById('cust-name').value;
    if (!name) { alert("Por favor escribe tu nombre."); return; }
    
    const delivery = document.getElementById('cust-delivery').value;
    const payment = document.getElementById('cust-payment').value;
    
    let itemsText = "";
    let total = 0;
    for (let id in cart) {
      const p = products.find(prod => prod.id == id);
      itemsText += `• ${p.name} (x${cart[id]}) - $${(p.price * cart[id]).toFixed(2)}\n`;
      total += p.price * cart[id];
    }
    
    const msg = `¡Hola *El Taller de Brownie*! Quisiera realizar el siguiente pedido:\n\n*Cliente:* ${name}\n*Entrega:* ${delivery}\n*Pago:* ${payment}\n\n*Productos:*\n${itemsText}\n*Total:* $${total.toFixed(2)} MXN`;
    
    const phone = "529981732170";
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  renderProducts();
</script>
</body>
</html>
